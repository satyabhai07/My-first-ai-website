<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Owner Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;font-family:Arial,sans-serif;padding:20px}.login-box{width:100%;max-width:400px;padding:35px;border:1px solid #333;border-radius:18px;background:#0b0b0b}h1{font-size:30px;margin-bottom:8px}.subtitle{color:#999;margin-bottom:30px}input{width:100%;padding:15px;margin-bottom:15px;background:#111;color:#fff;border:1px solid #333;border-radius:10px;outline:none}input:focus{border-color:#fff}button{width:100%;padding:15px;background:#fff;color:#000;border:0;border-radius:10px;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}#message{min-height:18px;margin-top:18px;text-align:center;color:#ff6b6b;font-size:13px}
</style>
</head>
<body>
<div class="login-box">
<h1>Owner Login</h1>
<p class="subtitle">Login to access your dashboard</p>
<input type="email" id="email" placeholder="Owner Email" autocomplete="email">
<input type="password" id="password" placeholder="Password" autocomplete="current-password">
<button id="loginBtn" type="button">LOGIN</button>
<p id="message"></p>
</div>
<script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const U="https://sctyvhjmmtxjcpdecwfe.supabase.co";
const K="sb_publishable_qsyg3Kk-XeSl7TSXKSZchg_0GJuoksR";
const O="b1da36d1-80cd-4ed3-a763-4d98813de873";
const s=createClient(U,K),email=document.getElementById("email"),password=document.getElementById("password"),message=document.getElementById("message"),btn=document.getElementById("loginBtn");
async function login(){const e=email.value.trim(),p=password.value;if(!e||!p){message.textContent="Enter email and password.";return}btn.disabled=true;btn.textContent="LOGGING IN...";message.textContent="";const{data,error}=await s.auth.signInWithPassword({email:e,password:p});if(error||!data.user){btn.disabled=false;btn.textContent="LOGIN";message.textContent="Invalid email or password.";return}if(data.user.id!==O){await s.auth.signOut();btn.disabled=false;btn.textContent="LOGIN";message.textContent="Owner access only.";return}location.replace("owner-dashboard.html")}
btn.addEventListener("click",login);password.addEventListener("keydown",e=>{if(e.key==="Enter")login()});
const{data:{session}}=await s.auth.getSession();if(session?.user?.id===O)location.replace("owner-dashboard.html");
</script>
</body>
</html>
