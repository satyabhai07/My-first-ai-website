
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Owner Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border: 1px solid #333;
            border-radius: 18px;
            background: #0b0b0b;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #999;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background: #111;
            color: white;
            border: 1px solid #333;
            border-radius: 10px;
            outline: none;
        }

        input:focus {
            border-color: #fff;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            color: #ff6b6b;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Owner Login</h1>

        <p class="subtitle">
            Login to access your dashboard
        </p>

        <input
            type="email"
            id="email"
            placeholder="Owner Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="login()">
            LOGIN
        </button>

        <p id="message"></p>

    </div>

    <script type="module">

        import { createClient } from
        "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

        const SUPABASE_URL =
            "https://sctyvhjmmtxjcpdecwfe.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_qsyg3Kk-XeSl7TSXKSZchg_0GJuoksR";

        const supabase = createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        window.login = async function () {

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");

            message.textContent = "Logging in...";

            const { data, error } =
                await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

            if (error) {

                message.textContent =
                    "Invalid email or password.";

                return;
            }

            window.location.href =
                "owner-dashboard.html";
        };

    </script>

</body>
</html>
