<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Owner Dashboard</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #050505;
    --panel: #0b0b0b;
    --panel-2: #101010;
    --border: #202020;
    --border-hover: #3a3a3a;
    --text: #ffffff;
    --muted: #777;
    --muted-2: #555;
    --green: #78e08f;
    --red: #ff7675;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

/* NAVBAR */

.navbar {
    height: 74px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5%;
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(5,5,5,.92);
    backdrop-filter: blur(15px);
}

.logo {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 4px;
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 18px;
}

.owner-label {
    color: #888;
    font-size: 12px;
    letter-spacing: 1.5px;
}

.live-dot {
    width: 8px;
    height: 8px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(120,224,143,.5);
}

/* MAIN */

.container {
    width: 90%;
    max-width: 1250px;
    margin: 55px auto;
}

/* HEADER */

.header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 35px;
}

.header h1 {
    font-size: 48px;
    line-height: 1;
    letter-spacing: -2px;
    margin-bottom: 12px;
}

.header p {
    color: var(--muted);
    font-size: 14px;
}

.refresh-btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: white;
    padding: 12px 18px;
    border-radius: 9px;
    cursor: pointer;
    transition: .2s;
}

.refresh-btn:hover {
    border-color: var(--border-hover);
    background: #151515;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 35px;
}

.stat-card {
    background: linear-gradient(145deg, #0d0d0d, #080808);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    position: relative;
    overflow: hidden;
    transition: .25s;
}

.stat-card:hover {
    transform: translateY(-3px);
    border-color: var(--border-hover);
}

.stat-label {
    color: #777;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
}

.stat-number {
    font-size: 38px;
    font-weight: 700;
    margin-top: 14px;
}

.stat-sub {
    color: #555;
    font-size: 12px;
    margin-top: 8px;
}

.status {
    color: var(--green);
}

/* CONTENT */

.content {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
}

.content-top {
    padding: 25px;
    border-bottom: 1px solid var(--border);
}

.content-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 20px;
}

.content-title h2 {
    font-size: 21px;
}

.badge {
    font-size: 11px;
    color: #aaa;
    border: 1px solid #292929;
    padding: 6px 9px;
    border-radius: 20px;
}

/* SEARCH */

.controls {
    display: flex;
    gap: 10px;
}

.search {
    flex: 1;
    background: #070707;
    border: 1px solid var(--border);
    color: white;
    padding: 13px 15px;
    border-radius: 9px;
    outline: none;
    font-size: 13px;
}

.search:focus {
    border-color: #444;
}

.filter {
    background: #070707;
    color: #aaa;
    border: 1px solid var(--border);
    padding: 0 15px;
    border-radius: 9px;
    cursor: pointer;
}

/* MESSAGE LIST */

.message-list {
    display: flex;
    flex-direction: column;
}

.message-card {
    padding: 24px 25px;
    border-bottom: 1px solid var(--border);
    transition: .2s;
}

.message-card:last-child {
    border-bottom: none;
}

.message-card:hover {
    background: #0e0e0e;
}

.message-card.unread {
    border-left: 3px solid white;
}

.message-top {
    display: flex;
    justify-content: space-between;
    gap: 20px;
}

.person {
    display: flex;
    gap: 13px;
    align-items: center;
}

.avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #161616;
    border: 1px solid #292929;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 15px;
}

.message-name {
    font-weight: 600;
    font-size: 15px;
}

.message-email {
    color: #666;
    font-size: 12px;
    margin-top: 5px;
}

.message-date {
    color: #555;
    font-size: 11px;
    text-align: right;
}

.message-text {
    color: #bbb;
    line-height: 1.7;
    margin: 18px 0;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
}

.message-actions {
    display: flex;
    gap: 8px;
}

.action-btn {
    border: 1px solid #292929;
    background: #101010;
    color: #aaa;
    padding: 8px 12px;
    border-radius: 7px;
    font-size: 11px;
    cursor: pointer;
    transition: .2s;
}

.action-btn:hover {
    background: white;
    color: black;
    border-color: white;
}

.delete-btn:hover {
    background: #fff;
    color: #000;
}

/* EMPTY */

.empty {
    padding: 70px 20px;
    text-align: center;
    color: #555;
}

.empty-icon {
    font-size: 35px;
    margin-bottom: 15px;
}

.loading {
    padding: 60px;
    text-align: center;
    color: #555;
}

/* FOOTER */

.footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 25px;
}

.security {
    color: #555;
    font-size: 11px;
}

.logout {
    background: white;
    color: black;
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
}

.logout:hover {
    opacity: .8;
}

/* MOBILE */

@media (max-width: 750px) {

    .navbar {
        height: 65px;
        padding: 0 5%;
    }

    .owner-label {
        display: none;
    }

    .container {
        width: 92%;
        margin: 35px auto;
    }

    .header {
        align-items: flex-start;
        flex-direction: column;
    }

    .header h1 {
        font-size: 36px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .controls {
        flex-direction: column;
    }

    .filter {
        height: 43px;
    }

    .content-top {
        padding: 20px;
    }

    .message-card {
        padding: 20px;
    }

    .message-top {
        flex-direction: column;
    }

    .message-date {
        text-align: left;
    }

    .message-actions {
        flex-wrap: wrap;
    }

    .footer {
        flex-direction: column;
        gap: 15px;
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<nav class="navbar">

    <div class="logo">
        PIHU
    </div>

    <div class="nav-right">
        <span class="live-dot"></span>
        <span class="owner-label">
            OWNER PANEL
        </span>
    </div>

</nav>


<main class="container">

    <section class="header">

        <div>
            <h1>Dashboard</h1>
            <p>Manage your website activity and incoming messages.</p>
        </div>

        <button class="refresh-btn" onclick="loadMessages()">
            ↻ Refresh
        </button>

    </section>


    <!-- STATS -->

    <section class="stats">

        <div class="stat-card">
            <div class="stat-label">
                Total Messages
            </div>

            <div class="stat-number" id="totalMessages">
                0
            </div>

            <div class="stat-sub">
                All incoming enquiries
            </div>
        </div>


        <div class="stat-card">
            <div class="stat-label">
                Unread
            </div>

            <div class="stat-number" id="unreadMessages">
                0
            </div>

            <div class="stat-sub">
                Messages waiting for review
            </div>
        </div>


        <div class="stat-card">
            <div class="stat-label">
                Website Status
            </div>

            <div class="stat-number status">
                LIVE
            </div>

            <div class="stat-sub">
                Website is operational
            </div>
        </div>

    </section>


    <!-- MESSAGES -->

    <section class="content">

        <div class="content-top">

            <div class="content-title">

                <h2>
                    Messages
                </h2>

                <span class="badge" id="resultBadge">
                    0 messages
                </span>

            </div>


            <div class="controls">

                <input
                    type="text"
                    id="searchInput"
                    class="search"
                    placeholder="Search by name, email or message..."
                    oninput="renderMessages()"
                >

                <select
                    id="filterSelect"
                    class="filter"
                    onchange="renderMessages()"
                >
                    <option value="all">All</option>
                    <option value="unread">Unread</option>
                    <option value="read">Read</option>
                </select>

            </div>

        </div>


        <div
            id="messageList"
            class="message-list"
        >
            <div class="loading">
                Loading messages...
            </div>
        </div>

    </section>


    <div class="footer">

        <div class="security">
            🔒 Owner access protected
        </div>

        <button
            class="logout"
            onclick="logout()"
        >
            LOGOUT
        </button>

    </div>

</main>


<script type="module">

import {
    createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* SUPABASE */

const SUPABASE_URL =
    "https://sctyvhjmmtxjcpdecwfe.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_qsyg3Kk-XeSl7TSXKSZchg_0GJuoksR";

const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let allMessages = [];


/* CHECK OWNER */

async function checkOwner() {

    const {
        data,
        error
    } = await supabase.auth.getSession();

    if (
        error ||
        !data.session
    ) {

        window.location.href =
            "owner-login.html";

        return false;
    }

    return true;
}


/* LOAD MESSAGES */

window.loadMessages = async function () {

    const messageList =
        document.getElementById(
            "messageList"
        );

    messageList.innerHTML =
        `<div class="loading">Loading messages...</div>`;


    const {
        data: messages,
        error
    } = await supabase
        .from("messages")
        .select("*")
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        messageList.innerHTML =
            `<div class="empty">
                Unable to load messages.
            </div>`;

        return;
    }


    allMessages = messages || [];


    updateStats();

    renderMessages();

};


/* UPDATE STATS */

function updateStats() {

    const total =
        allMessages.length;

    const unread =
        allMessages.filter(
            message =>
                !message.is_read
        ).length;


    document.getElementById(
        "totalMessages"
    ).textContent = total;


    document.getElementById(
        "unreadMessages"
    ).textContent = unread;


    document.getElementById(
        "resultBadge"
    ).textContent =
        `${total} message${total === 1 ? "" : "s"}`;

}


/* RENDER */

window.renderMessages = function () {

    const list =
        document.getElementById(
            "messageList"
        );

    const search =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();


    const filter =
        document.getElementById(
            "filterSelect"
        ).value;


    const filtered =
        allMessages.filter(message => {

            const text =
                `${message.name} ${message.email} ${message.message}`
                .toLowerCase();


            const matchesSearch =
                text.includes(search);


            let matchesFilter = true;


            if (
                filter === "unread"
            ) {
                matchesFilter =
                    !message.is_read;
            }


            if (
                filter === "read"
            ) {
                matchesFilter =
                    message.is_read;
            }


            return (
                matchesSearch &&
                matchesFilter
            );

        });


    if (
        filtered.length === 0
    ) {

        list.innerHTML =
            `<div class="empty">

                <div class="empty-icon">
                    ✉
                </div>

                No messages found.

            </div>`;

        return;
    }


    list.innerHTML =
        filtered
        .map(message => {

            const date =
                new Date(
                    message.created_at
                );


            const formattedDate =
                date.toLocaleString(
                    undefined,
                    {
                        dateStyle: "medium",
                        timeStyle: "short"
                    }
                );


            const initial =
                escapeHtml(
                    String(
                        message.name || "U"
                    )
                    .charAt(0)
                    .toUpperCase()
                );


            return `

                <div class="message-card ${
                    message.is_read
                    ? ""
                    : "unread"
                }">

                    <div class="message-top">

                        <div class="person">

                            <div class="avatar">
                                ${initial}
                            </div>

                            <div>

                                <div class="message-name">
                                    ${escapeHtml(
                                        message.name
                                    )}
                                </div>

                                <div class="message-email">
                                    ${escapeHtml(
                                        message.email
                                    )}
                                </div>

                            </div>

                        </div>


                        <div class="message-date">
                            ${formattedDate}
                        </div>

                    </div>


                    <div class="message-text">
                        ${escapeHtml(
                            message.message
                        )}
                    </div>


                    <div class="message-actions">

                        ${
                            message.is_read

                            ? `
                            <button
                                class="action-btn"
                                onclick="markUnread(${message.id})"
                            >
                                Mark Unread
                            </button>
                            `

                            : `
                            <button
                                class="action-btn"
                                onclick="markRead(${message.id})"
                            >
                                ✓ Mark Read
                            </button>
                            `
                        }


                        <button
                            class="action-btn delete-btn"
                            onclick="deleteMessage(${message.id})"
                        >
                            Delete
                        </button>

                    </div>

                </div>

            `;

        })
        .join("");

};


/* ESCAPE HTML */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* MARK READ */

window.markRead =
async function(id) {

    const {
        error
    } = await supabase
        .from("messages")
        .update({
            is_read: true
        })
        .eq(
            "id",
            id
        );


    if (error) {

        console.error(error);

        alert(
            "Could not mark message as read."
        );

        return;
    }


    await loadMessages();

};


/* MARK UNREAD */

window.markUnread =
async function(id) {

    const {
        error
    } = await supabase
        .from("messages")
        .update({
            is_read: false
        })
        .eq(
            "id",
            id
        );


    if (error) {

        console.error(error);

        alert(
            "Could not mark message as unread."
        );

        return;
    }


    await loadMessages();

};


/* DELETE */

window.deleteMessage =
async function(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this message?"
        );


    if (!confirmed) {
        return;
    }


    const {
        error
    } = await supabase
        .from("messages")
        .delete()
        .eq(
            "id",
            id
        );


    if (error) {

        console.error(error);

        alert(
            "Could not delete message."
        );

        return;
    }


    await loadMessages();

};


/* LOGOUT */

window.logout =
async function() {

    await supabase.auth.signOut();

    window.location.href =
        "owner-login.html";

};


/* START */

async function startDashboard() {

    const isOwner =
        await checkOwner();


    if (!isOwner) {
        return;
    }


    await loadMessages();

}


startDashboard();

</script>

</body>
</html>
