<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Owner Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .navbar {
            height: 70px;
            padding: 0 6%;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .owner {
            color: #888;
            font-size: 14px;
        }

        .container {
            width: 88%;
            max-width: 1200px;
            margin: 50px auto;
        }

        .heading {
            margin-bottom: 35px;
        }

        .heading h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .heading p {
            color: #888;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: #0b0b0b;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 25px;
        }

        .card span {
            color: #888;
            font-size: 14px;
        }

        .card h2 {
            font-size: 32px;
            margin-top: 12px;
        }

        .panel {
            background: #0b0b0b;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 30px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .panel-header h2 {
            font-size: 22px;
        }

        .empty {
            padding: 50px 20px;
            text-align: center;
            color: #777;
            border: 1px dashed #333;
            border-radius: 12px;
        }

        .logout {
            margin-top: 30px;
            padding: 13px 22px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .logout:hover {
            opacity: 0.8;
        }

        @media (max-width: 700px) {

            .navbar {
                padding: 0 5%;
            }

            .container {
                width: 90%;
                margin: 35px auto;
            }

            .heading h1 {
                font-size: 32px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .panel {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            PIHU
        </div>

        <div class="owner">
            OWNER PANEL
        </div>

    </nav>

    <main class="container">

        <div class="heading">
            <h1>Dashboard</h1>
            <p>Welcome back, Owner.</p>
        </div>

        <section class="cards">

            <div class="card">
                <span>Total Messages</span>
                <h2 id="totalMessages">0</h2>
            </div>

            <div class="card">
                <span>Unread</span>
                <h2 id="unreadMessages">0</h2>
            </div>

            <div class="card">
                <span>Website Status</span>
                <h2>LIVE</h2>
            </div>

        </section>

        <section class="panel">

            <div class="panel-header">
                <h2>Recent Messages</h2>
            </div>

            <div class="empty">
                Messages will appear here.
            </div>

        </section>

        <button class="logout" onclick="logout()">
            LOGOUT
        </button>

    </main>

    <script type="module">

        import { createClient } from
        "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

        const SUPABASE_URL =
            "https://sctyvhjmmtxjcpdecwfe.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_qsyg3Kk-XeSl7TSXKSZchg_0GJuoksR";

        const supabase = createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        async function checkOwner() {

            const { data } =
                await supabase.auth.getSession();

            if (!data.session) {

                window.location.href =
                    "owner-login.html";

            }
        }

        window.logout = async function () {

            await supabase.auth.signOut();

            window.location.href =
                "owner-login.html";
        };

        checkOwner();

    </script>

</body>
</html>
