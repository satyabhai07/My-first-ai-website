<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Owner Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .navbar {
            height: 70px;
            padding: 0 6%;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .owner {
            color: #888;
            font-size: 14px;
        }

        .container {
            width: 88%;
            max-width: 1200px;
            margin: 50px auto;
        }

        .heading {
            margin-bottom: 35px;
        }

        .heading h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .heading p {
            color: #888;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: #0b0b0b;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 25px;
        }

        .card span {
            color: #888;
            font-size: 14px;
        }

        .card h2 {
            font-size: 32px;
            margin-top: 12px;
        }

        .panel {
            background: #0b0b0b;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 30px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .panel-header h2 {
            font-size: 22px;
        }

        .message-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message-card {
            border: 1px solid #222;
            border-radius: 12px;
            padding: 20px;
            background: #050505;
        }

        .message-card.unread {
            border-color: #555;
        }

        .message-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 12px;
        }

        .message-name {
            font-size: 17px;
            font-weight: bold;
        }

        .message-email {
            color: #888;
            font-size: 13px;
            margin-top: 5px;
        }

        .message-date {
            color: #666;
            font-size: 12px;
            text-align: right;
        }

        .message-text {
            color: #ccc;
            line-height: 1.6;
            margin: 15px 0;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 9px 14px;
            border: 1px solid #333;
            background: #111;
            color: #fff;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
        }

        .action-btn:hover {
            background: #fff;
            color: #000;
        }

        .delete-btn:hover {
            background: #fff;
            color: #000;
        }

        .empty {
            padding: 50px 20px;
            text-align: center;
            color: #777;
            border: 1px dashed #333;
            border-radius: 12px;
        }

        .logout {
            margin-top: 30px;
            padding: 13px 22px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .logout:hover {
            opacity: 0.8;
        }

        .loading {
            color: #777;
            text-align: center;
            padding: 30px;
        }

        @media (max-width: 700px) {

            .navbar {
                padding: 0 5%;
            }

            .container {
                width: 90%;
                margin: 35px auto;
            }

            .heading h1 {
                font-size: 32px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .panel {
                padding: 20px;
            }

            .message-top {
                flex-direction: column;
            }

            .message-date {
                text-align: left;
            }

            .message-actions {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            PIHU
        </div>

        <div class="owner">
            OWNER PANEL
        </div>

    </nav>


    <main class="container">

        <div class="heading">

            <h1>Dashboard</h1>

            <p>Welcome back, Owner.</p>

        </div>


        <section class="cards">

            <div class="card">
                <span>Total Messages</span>
                <h2 id="totalMessages">0</h2>
            </div>

            <div class="card">
                <span>Unread</span>
                <h2 id="unreadMessages">0</h2>
            </div>

            <div class="card">
                <span>Website Status</span>
                <h2>LIVE</h2>
            </div>

        </section>


        <section class="panel">

            <div class="panel-header">

                <h2>Recent Messages</h2>

            </div>


            <div id="messageList" class="message-list">

                <div class="loading">
                    Loading messages...
                </div>

            </div>

        </section>


        <button class="logout" onclick="logout()">
            LOGOUT
        </button>

    </main>


    <script type="module">

        import { createClient } from
        "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


        const SUPABASE_URL =
            "https://sctyvhjmmtxjcpdecwfe.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_qsyg3Kk-XeSl7TSXKSZchg_0GJuoksR";


        const supabase = createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


        async function checkOwner() {

            const { data, error } =
                await supabase.auth.getSession();

            if (error || !data.session) {

                window.location.href =
                    "owner-login.html";

                return false;
            }

            return true;
        }


        async function loadMessages() {

            const {
                data: messages,
                error
            } = await supabase
                .from("messages")
                .select("*")
                .order("created_at", {
                    ascending: false
                });


            if (error) {

                console.error(error);

                document.getElementById("messageList").innerHTML =
                    `
                    <div class="empty">
                        Failed to load messages.
                    </div>
                    `;

                return;
            }


            const total =
                messages.length;

            const unread =
                messages.filter(
                    message => !message.is_read
                ).length;


            document.getElementById("totalMessages")
                .textContent = total;

            document.getElementById("unreadMessages")
                .textContent = unread;


            const messageList =
                document.getElementById("messageList");


            if (messages.length === 0) {

                messageList.innerHTML =
                    `
                    <div class="empty">
                        No messages yet.
                    </div>
                    `;

                return;
            }


            messageList.innerHTML =
                messages.map(message => {

                    const date =
                        new Date(
                            message.created_at
                        ).toLocaleString();


                    return `
                        <div
                            class="message-card ${
                                message.is_read
                                    ? ""
                                    : "unread"
                            }"
                        >

                            <div class="message-top">

                                <div>

                                    <div class="message-name">
                                        ${escapeHtml(message.name)}
                                    </div>

                                    <div class="message-email">
                                        ${escapeHtml(message.email)}
                                    </div>

                                </div>

                                <div class="message-date">
                                    ${date}
                                </div>

                            </div>


                            <div class="message-text">
                                ${escapeHtml(message.message)}
                            </div>


                            <div class="message-actions">

                                ${
                                    message.is_read

                                    ?

                                    `
                                    <button
                                        class="action-btn"
                                        onclick="markUnread(${message.id})"
                                    >
                                        Mark Unread
                                    </button>
                                    `

                                    :

                                    `
                                    <button
                                        class="action-btn"
                                        onclick="markRead(${message.id})"
                                    >
                                        Mark Read
                                    </button>
                                    `
                                }


                                <button
                                    class="action-btn delete-btn"
                                    onclick="deleteMessage(${message.id})"
                                >
                                    Delete
                                </button>

                            </div>

                        </div>
                    `;

                }).join("");
        }


        function escapeHtml(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        window.markRead = async function(id) {

            const { error } =
                await supabase
                .from("messages")
                .update({
                    is_read: true
                })
                .eq("id", id);


            if (error) {

                alert(
                    "Could not mark message as read."
                );

                console.error(error);

                return;
            }


            loadMessages();
        };


        window.markUnread = async function(id) {

            const { error } =
                await supabase
                .from("messages")
                .update({
                    is_read: false
                })
                .eq("id", id);


            if (error) {

                alert(
                    "Could not mark message as unread."
                );

                console.error(error);

                return;
            }


            loadMessages();
        };


        window.deleteMessage = async function(id) {

            const confirmDelete =
                confirm(
                    "Delete this message?"
                );


            if (!confirmDelete) {
                return;
            }


            const { error } =
                await supabase
                .from("messages")
                .delete()
                .eq("id", id);


            if (error) {

                alert(
                    "Could not delete message."
                );

                console.error(error);

                return;
            }


            loadMessages();
        };


        window.logout = async function() {

            await supabase.auth.signOut();

            window.location.href =
                "owner-login.html";
        };


        async function startDashboard() {

            const isOwner =
                await checkOwner();

            if (!isOwner) {
                return;
            }

            await loadMessages();
        }


        startDashboard();

    </script>

</body>
</html>
