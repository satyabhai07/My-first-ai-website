<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #050505;
    --panel: #0b0b0b;
    --border: #202020;
    --text: #fff;
    --muted: #777;
    --green: #78e08f;
    --red: #ff7675;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

/* ================= NAVBAR ================= */

.navbar {
    height: 74px;
    border-bottom: 1px solid var(--border);
    padding: 0 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(5,5,5,.94);
    backdrop-filter: blur(15px);
}

.logo {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 4px;
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.live-dot {
    width: 8px;
    height: 8px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(120,224,143,.5);
}

.owner-label {
    color: #888;
    font-size: 11px;
    letter-spacing: 1.5px;
}

/* ================= CONTAINER ================= */

.container {
    width: 90%;
    max-width: 1250px;
    margin: 50px auto;
}

/* ================= HEADER ================= */

.header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    margin-bottom: 32px;
}

.header h1 {
    font-size: 48px;
    letter-spacing: -2px;
    margin-bottom: 10px;
}

.header p {
    color: var(--muted);
    font-size: 14px;
}

.header-actions {
    display: flex;
    gap: 10px;
}

.refresh-btn,
.notification-btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: #fff;
    padding: 12px 16px;
    border-radius: 9px;
    cursor: pointer;
}

.refresh-btn:hover,
.notification-btn:hover {
    background: #151515;
    border-color: #3a3a3a;
}

.notification-btn {
    position: relative;
}

.notification-badge {
    position: absolute;
    top: -7px;
    right: -7px;
    min-width: 19px;
    height: 19px;
    padding: 0 5px;
    background: #fff;
    color: #000;
    border-radius: 20px;
    font-size: 10px;
    font-weight: bold;
    display: none;
    align-items: center;
    justify-content: center;
}

/* ================= STATS ================= */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 25px;
}

.stat-card {
    background: linear-gradient(145deg,#0d0d0d,#080808);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    transition: .25s;
}

.stat-card:hover {
    transform: translateY(-3px);
    border-color: #3a3a3a;
}

.stat-label {
    color: #777;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
}

.stat-number {
    font-size: 34px;
    font-weight: 700;
    margin-top: 12px;
}

.stat-sub {
    color: #555;
    font-size: 11px;
    margin-top: 7px;
}

.green {
    color: var(--green);
}

.red {
    color: var(--red);
}

/* ================= COMMON PANELS ================= */

.panel,
.settings-panel,
.content,
.section-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
}

/* ================= MESSAGE ANALYTICS ================= */

.analytics {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 18px;
    margin-bottom: 25px;
}

.panel {
    padding: 24px;
}

.panel-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.panel-title h2 {
    font-size: 18px;
}

.panel-title span {
    color: #555;
    font-size: 11px;
}

.chart {
    height: 150px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    border-bottom: 1px solid #202020;
    padding: 0 5px;
}

.bar-wrap {
    height: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
}

.bar {
    width: 100%;
    max-width: 42px;
    min-height: 3px;
    background: #fff;
    border-radius: 5px 5px 0 0;
    transition: height .5s ease;
}

.bar-label {
    color: #555;
    font-size: 9px;
    margin-bottom: -22px;
    transform: translateY(22px);
}

.activity {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.activity-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 13px;
    border-bottom: 1px solid #181818;
}

.activity-row:last-child {
    border-bottom: none;
}

.activity-name {
    color: #888;
    font-size: 12px;
}

.activity-value {
    font-size: 17px;
    font-weight: bold;
}

/* ================= VISITOR ANALYTICS ================= */

.visitor-analytics {
    margin-bottom: 25px;
}

.analytics-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

.analytics-header h2 {
    font-size: 20px;
}

.analytics-header p {
    color: #666;
    font-size: 12px;
    margin-top: 6px;
}

.analytics-updated {
    color: #555;
    font-size: 10px;
    border: 1px solid #292929;
    padding: 7px 10px;
    border-radius: 20px;
}

.visitor-cards {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 15px;
    margin-bottom: 18px;
}

.visitor-card {
    background: #080808;
    border: 1px solid #1c1c1c;
    border-radius: 14px;
    padding: 20px;
    min-height: 105px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: .25s;
}

.visitor-card:hover {
    border-color: #3a3a3a;
    transform: translateY(-2px);
}

.visitor-card span {
    color: #777;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
}

.visitor-card strong {
    color: #fff;
    font-size: 29px;
    font-weight: 700;
}

.visitor-chart-panel {
    background: #080808;
    border: 1px solid #1c1c1c;
    border-radius: 14px;
    padding: 22px;
}

.visitor-chart-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.visitor-chart-title h3 {
    font-size: 16px;
}

.visitor-chart-title span {
    color: #555;
    font-size: 10px;
}

.visitor-chart {
    height: 210px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    border-bottom: 1px solid #202020;
    padding: 0 5px;
}

.visitor-day {
    height: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    gap: 7px;
}

.visitor-bar {
    width: 100%;
    max-width: 45px;
    min-height: 3px;
    background: #fff;
    border-radius: 5px 5px 0 0;
    transition: height .5s ease;
}

.visitor-count {
    color: #aaa;
    font-size: 10px;
}

.visitor-label {
    color: #555;
    font-size: 9px;
    margin-bottom: -20px;
    transform: translateY(20px);
}

/* ================= SETTINGS ================= */

.settings-panel {
    padding: 24px;
    margin-bottom: 25px;
}

.settings-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

.settings-header h2 {
    font-size: 20px;
}

.settings-header p {
    color: #666;
    font-size: 12px;
    margin-top: 6px;
}

.settings-status {
    padding: 7px 11px;
    border: 1px solid #292929;
    border-radius: 20px;
    color: #aaa;
    font-size: 10px;
}

.settings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.setting-item {
    background: #080808;
    border: 1px solid #1c1c1c;
    border-radius: 14px;
    padding: 20px;
}

.setting-item.full {
    grid-column: 1 / -1;
}

.setting-label {
    color: #aaa;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.3px;
    margin-bottom: 10px;
}

.setting-description {
    color: #555;
    font-size: 11px;
    margin-bottom: 13px;
    line-height: 1.5;
}

.setting-select,
.setting-textarea {
    width: 100%;
    background: #050505;
    border: 1px solid #292929;
    color: #fff;
    border-radius: 9px;
    outline: none;
}

.setting-select {
    padding: 12px;
}

.setting-textarea {
    min-height: 100px;
    padding: 13px;
    resize: vertical;
    font-family: inherit;
}

.setting-select:focus,
.setting-textarea:focus {
    border-color: #555;
}

.toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.toggle {
    position: relative;
    width: 48px;
    height: 26px;
    flex-shrink: 0;
}

.toggle input {
    opacity: 0;
    width: 0;
    height: 0;
}

.slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: #252525;
    border-radius: 30px;
    transition: .25s;
}

.slider:before {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    left: 3px;
    top: 3px;
    background: #777;
    border-radius: 50%;
    transition: .25s;
}

.toggle input:checked + .slider {
    background: #fff;
}

.toggle input:checked + .slider:before {
    transform: translateX(22px);
    background: #000;
}

.settings-footer {
    display: flex;
    justify-content: flex-end;
    margin-top: 20px;
}

.save-settings {
    background: #fff;
    color: #000;
    border: none;
    padding: 12px 20px;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
}

.save-settings:hover {
    background: #ddd;
}

.save-settings:disabled {
    opacity: .6;
    cursor: not-allowed;
}

/* ================= OWNER PROFILE ================= */

.section-card {
    padding: 24px;
    margin-bottom: 25px;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 5px;
}

.section-title h2 {
    font-size: 20px;
}

.section-title p {
    color: #666;
    font-size: 12px;
    margin-top: 6px;
}

.profile-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-top: 20px;
}

.profile-item {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.profile-item label {
    font-size: 13px;
    color: #aaa;
}

.profile-item input {
    width: 100%;
    padding: 12px 14px;
    background: #111;
    color: #fff;
    border: 1px solid #333;
    border-radius: 8px;
    outline: none;
}

.profile-item input:focus {
    border-color: #fff;
}

.profile-item input:disabled {
    color: #777;
    cursor: not-allowed;
}

.save-btn {
    margin-top: 20px;
    padding: 12px 22px;
    background: #fff;
    color: #000;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
}

.save-btn:hover {
    opacity: 0.85;
}

.save-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

/* ================= USER MANAGEMENT ================= */

.user-management {
    margin-bottom: 25px;
}

.user-controls {
    display: grid;
    grid-template-columns: 1fr 180px;
    gap: 12px;
    margin-top: 20px;
}

.user-controls .search,
.user-controls .filter {
    width: 100%;
}

.user-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 20px;
}

.user-card {
    background: #080808;
    border: 1px solid #1c1c1c;
    border-radius: 12px;
    padding: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    transition: .25s;
}

.user-card:hover {
    border-color: #3a3a3a;
    transform: translateY(-1px);
}

.user-info {
    min-width: 0;
}

.user-name {
    color: #fff;
    font-size: 15px;
    font-weight: 600;
}

.user-email {
    color: #777;
    font-size: 12px;
    margin-top: 5px;
    word-break: break-word;
}

.user-date {
    color: #555;
    font-size: 11px;
    margin-top: 6px;
}

.user-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
}

.user-status {
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    border: 1px solid #333;
}

.user-status.active {
    color: var(--green);
    border-color: rgba(120,224,143,.25);
    background: rgba(120,224,143,.05);
}

.user-status.blocked {
    color: var(--red);
    border-color: rgba(255,118,117,.25);
    background: rgba(255,118,117,.05);
}

.user-action-btn {
    border: 1px solid #292929;
    background: #101010;
    color: #aaa;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 11px;
}

.user-action-btn:hover {
    background: #fff;
    color: #000;
}

.user-action-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.user-empty {
    padding: 45px 20px;
    text-align: center;
    color: #555;
    border: 1px dashed #292929;
    border-radius: 10px;
}

/* ================= MESSAGES ================= */

.content {
    overflow: hidden;
}

.content-top {
    padding: 24px;
    border-bottom: 1px solid var(--border);
}

.content-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 18px;
}

.content-title h2 {
    font-size: 20px;
}

.badge {
    border: 1px solid #292929;
    color: #aaa;
    padding: 6px 9px;
    border-radius: 20px;
    font-size: 10px;
    white-space: nowrap;
}

.controls {
    display: flex;
    gap: 10px;
}

.search {
    flex: 1;
    background: #070707;
    border: 1px solid var(--border);
    color: #fff;
    padding: 13px 15px;
    border-radius: 9px;
    outline: none;
}

.search:focus {
    border-color: #444;
}

.filter {
    background: #070707;
    color: #aaa;
    border: 1px solid var(--border);
    padding: 0 15px;
    border-radius: 9px;
    outline: none;
}

.message-list {
    display: flex;
    flex-direction: column;
}

.message-card {
    padding: 23px 25px;
    border-bottom: 1px solid var(--border);
    transition: .2s;
}

.message-card:last-child {
    border-bottom: none;
}

.message-card:hover {
    background: #0e0e0e;
}

.message-card.unread {
    border-left: 3px solid #fff;
}

.message-top {
    display: flex;
    justify-content: space-between;
    gap: 20px;
}

.person {
    display: flex;
    align-items: center;
    gap: 13px;
}

.avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #161616;
    border: 1px solid #292929;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    flex-shrink: 0;
}

.message-name {
    font-size: 15px;
    font-weight: 600;
}

.message-email {
    color: #666;
    font-size: 12px;
    margin-top: 5px;
    word-break: break-word;
}

.message-date {
    color: #555;
    font-size: 11px;
    text-align: right;
}

.message-text {
    color: #bbb;
    line-height: 1.7;
    font-size: 14px;
    margin: 18px 0;
    white-space: pre-wrap;
    word-break: break-word;
}

.message-actions {
    display: flex;
    gap: 8px;
}

.action-btn {
    border: 1px solid #292929;
    background: #101010;
    color: #aaa;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 11px;
}

.action-btn:hover {
    background: #fff;
    color: #000;
}

.empty,
.loading {
    padding: 65px 20px;
    text-align: center;
    color: #555;
}

/* ================= FOOTER ================= */

.footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 25px;
}

.security {
    color: #555;
    font-size: 11px;
}

.logout {
    background: #fff;
    color: #000;
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.logout:hover {
    background: #ddd;
}

/* ================= TOAST ================= */

.toast {
    position: fixed;
    right: 25px;
    bottom: 25px;
    background: #fff;
    color: #000;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: bold;
    transform: translateY(100px);
    opacity: 0;
    transition: .3s;
    z-index: 999;
}

.toast.show {
    transform: translateY(0);
    opacity: 1;
}

/* ================= RESPONSIVE ================= */

@media (max-width: 1000px) {

    .visitor-cards {
        grid-template-columns: repeat(3, 1fr);
    }

}

@media (max-width: 900px) {

    .stats {
        grid-template-columns: repeat(2,1fr);
    }

    .analytics {
        grid-template-columns: 1fr;
    }

    .settings-grid {
        grid-template-columns: 1fr;
    }

    .setting-item.full {
        grid-column: auto;
    }

    .visitor-cards {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media (max-width: 700px) {

    .profile-grid {
        grid-template-columns: 1fr;
    }

    .user-controls {
        grid-template-columns: 1fr;
    }

    .user-card {
        flex-direction: column;
        align-items: flex-start;
    }

    .user-actions {
        width: 100%;
        justify-content: space-between;
        flex-wrap: wrap;
    }

}

@media (max-width: 650px) {

    .container {
        width: 92%;
        margin: 35px auto;
    }

    .navbar {
        padding: 0 4%;
    }

    .owner-label {
        font-size: 9px;
    }

    .header {
        align-items: flex-start;
        flex-direction: column;
    }

    .header h1 {
        font-size: 36px;
    }

    .header-actions {
        width: 100%;
    }

    .refresh-btn,
    .notification-btn {
        flex: 1;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .controls {
        flex-direction: column;
    }

    .filter {
        min-height: 43px;
    }

    .message-top {
        flex-direction: column;
    }

    .message-date {
        text-align: left;
    }

    .message-actions {
        flex-wrap: wrap;
    }

    .settings-header {
        align-items: flex-start;
        flex-direction: column;
    }

    .settings-footer {
        justify-content: stretch;
    }

    .save-settings {
        width: 100%;
    }

    .section-card {
        padding: 20px;
    }

    .section-title {
        align-items: flex-start;
    }

    .save-btn {
        width: 100%;
    }

    .footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    .visitor-cards {
        grid-template-columns: 1fr;
    }

    .analytics-header {
        align-items: flex-start;
        flex-direction: column;
    }

    .visitor-chart {
        gap: 5px;
    }

    .visitor-chart-panel {
        padding: 15px;
    }

    .toast {
        left: 15px;
        right: 15px;
        bottom: 15px;
        text-align: center;
    }

}
</style>
