<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SATYA — Owner Dashboard</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #050505;
    --panel: #0b0b0b;
    --border: #202020;
    --text: #fff;
    --muted: #777;
    --green: #78e08f;
    --red: #ff7675;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

.navbar {
    height: 74px;
    border-bottom: 1px solid var(--border);
    padding: 0 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(5,5,5,.94);
    backdrop-filter: blur(15px);
}

.logo {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 4px;
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.live-dot {
    width: 8px;
    height: 8px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(120,224,143,.5);
}

.owner-label {
    color: #888;
    font-size: 11px;
    letter-spacing: 1.5px;
}

.container {
    width: 90%;
    max-width: 1250px;
    margin: 50px auto;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    margin-bottom: 32px;
}

.header h1 {
    font-size: 48px;
    letter-spacing: -2px;
    margin-bottom: 10px;
}

.header p {
    color: var(--muted);
    font-size: 14px;
}

.header-actions {
    display: flex;
    gap: 10px;
}

.refresh-btn,
.notification-btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: #fff;
    padding: 12px 16px;
    border-radius: 9px;
    cursor: pointer;
}

.refresh-btn:hover,
.notification-btn:hover {
    background: #151515;
    border-color: #3a3a3a;
}

.notification-btn {
    position: relative;
}

.notification-badge {
    position: absolute;
    top: -7px;
    right: -7px;
    min-width: 19px;
    height: 19px;
    padding: 0 5px;
    background: #fff;
    color: #000;
    border-radius: 20px;
    font-size: 10px;
    font-weight: bold;
    display: none;
    align-items: center;
    justify-content: center;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 25px;
}

.stat-card {
    background: linear-gradient(145deg,#0d0d0d,#080808);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    transition: .25s;
}

.stat-card:hover {
    transform: translateY(-3px);
    border-color: #3a3a3a;
}

.stat-label {
    color: #777;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
}

.stat-number {
    font-size: 34px;
    font-weight: 700;
    margin-top: 12px;
}

.stat-sub {
    color: #555;
    font-size: 11px;
    margin-top: 7px;
}

.green { color: var(--green); }
.red { color: var(--red); }

.panel,
.settings-panel,
.content,
.section-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
}

.analytics {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 18px;
    margin-bottom: 25px;
}

.panel {
    padding: 24px;
}

.panel-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.panel-title h2 {
    font-size: 18px;
}

.panel-title span {
    color: #555;
    font-size: 11px;
}

.chart {
    height: 150px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    border-bottom: 1px solid #202020;
    padding: 0 5px;
}

.bar-wrap {
    height: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
}

.bar {
    width: 100%;
    max-width: 42px;
    min-height: 3px;
    background: #fff;
    border-radius: 5px 5px 0 0;
    transition: height .5s ease;
}

.bar-label {
    color: #555;
    font-size: 9px;
    margin-bottom: -22px;
    transform: translateY(22px);
}

.activity {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.activity-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 13px;
    border-bottom: 1px solid #181818;
}

.activity-row:last-child {
    border-bottom: none;
}

.activity-name {
    color: #888;
    font-size: 12px;
}

.activity-value {
    font-size: 17px;
    font-weight: bold;
}

.visitor-analytics {
    margin-bottom: 25px;
}

.analytics-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

.analytics-header h2 {
    font-size: 20px;
}

.analytics-header p {
    color: #666;
    font-size: 12px;
    margin-top: 6px;
}

.analytics-updated {
    color: #555;
    font-size: 10px;
    border: 1px solid #292929;
    padding: 7px 10px;
    border-radius: 20px;
}

.visitor-cards {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 15px;
    margin-bottom: 18px;
}

.visitor-card {
    background: #080808;
    border: 1px solid #1c1c1c;
    border-radius: 14px;
    padding: 20px;
    min-height: 105px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.visitor-card span {
    color: #777;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
}

.visitor-card strong {
    color: #fff;
    font-size: 29px;
}

.visitor-chart-panel {
    background: #080808;
    border: 1px solid #1c1c1c;
    border-radius: 14px;
    padding: 22px;
}

.visitor-chart-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.visitor-chart-title h3 {
    font-size: 16px;
}

.visitor-chart-title span {
    color: #555;
    font-size: 10px;
}

.visitor-chart {
    height: 210px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    border-bottom: 1px solid #202020;
    padding: 0 5px;
}

.visitor-day {
    height: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    gap: 7px;
}

.visitor-bar {
    width: 100%;
    max-width: 45px;
    min-height: 3px;
    background: #fff;
    border-radius: 5px 5px 0 0;
}

.visitor-count {
    color: #aaa;
    font-size: 10px;
}

.visitor-label {
    color: #555;
    font-size: 9px;
    margin-bottom: -20px;
    transform: translateY(20px);
}

.settings-panel {
    padding: 24px;
    margin-bottom: 25px;
}

.settings-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

.settings-header h2 {
    font-size: 20px;
}

.settings-header p {
    color: #666;
    font-size: 12px;
    margin-top: 6px;
}

.settings-status {
    padding: 7px 11px;
    border: 1px solid #292929;
    border-radius: 20px;
    color: #aaa;
    font-size: 10px;
}

.settings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.setting-item {
    background: #080808;
    border: 1px solid #1c1c1c;
    border-radius: 14px;
    padding: 20px;
}

.setting-item.full {
    grid-column: 1 / -1;
}

.setting-label {
    color: #aaa;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.3px;
    margin-bottom: 10px;
}

.setting-description {
    color: #555;
    font-size: 11px;
    margin-bottom: 13px;
    line-height: 1.5;
}

.setting-select,
.setting-textarea {
    width: 100%;
    background: #050505;
    border: 1px solid #292929;
    color: #fff;
    border-radius: 9px;
    outline: none;
}

.setting-select {
    padding: 12px;
}

.setting-textarea {
    min-height: 100px;
    padding: 13px;
    resize: vertical;
    font-family: inherit;
}

.toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.toggle {
    position: relative
