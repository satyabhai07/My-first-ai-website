<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SATYA — Account</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#050505;--panel:#0b0b0b;--border:#202020;--text:#fff;--muted:#777;--green:#78e08f;--red:#ff7675}body{min-height:100vh;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}.nav{height:70px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 5%;background:rgba(5,5,5,.96);position:sticky;top:0;z-index:20}.brand{font-size:20px;font-weight:800;letter-spacing:4px}.logout{background:#fff;color:#000;border:0;border-radius:8px;padding:10px 16px;font-weight:800;cursor:pointer}.container{width:90%;max-width:1050px;margin:45px auto}.hero{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:25px}.hero h1{font-size:42px;margin-bottom:8px}.hero p{color:var(--muted)}.mode{font-size:10px;letter-spacing:1.3px;border:1px solid #333;border-radius:99px;padding:8px 11px;color:#aaa;white-space:nowrap}.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:26px;margin-bottom:18px}.title{font-size:18px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.item{background:#080808;border:1px solid #1c1c1c;border-radius:12px;padding:18px}.label{color:#666;font-size:10px;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px}.value{font-size:15px;word-break:break-word}.status{display:inline-block;padding:7px 11px;border-radius:20px;font-size:11px;border:1px solid rgba(120,224,143,.25);background:rgba(120,224,143,.05);color:var(--green);text-transform:uppercase}.plans-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:18px}.plans-head p{color:var(--muted);font-size:13px;margin-top:7px}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.plan{background:#080808;border:1px solid #232323;border-radius:16px;padding:22px;display:flex;flex-direction:column;min-height:245px}.plan.current{border-color:#666}.plan-name{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:#aaa}.price{font-size:36px;font-weight:900;margin:14px 0 3px}.period{font-size:12px;color:#666}.plan ul{list-style:none;margin:20px 0;display:grid;gap:10px;color:#aaa;font-size:13px}.plan li:before{content:"✓";color:#fff;margin-right:8px}.buy{margin-top:auto;width:100%;border:1px solid #ddd;background:#fff;color:#000;border-radius:9px;padding:12px 14px;font-weight:800;cursor:pointer}.buy:hover{background:#ddd}.buy:disabled{opacity:.55;cursor:not-allowed}.message{padding:35px;text-align:center;color:#777}.toast{position:fixed;right:18px;bottom:18px;background:#fff;color:#000;padding:13px 17px;border-radius:9px;opacity:0;transform:translateY(25px);transition:.25s;z-index:1000;max-width:320px;font-weight:700;font-size:13px}.toast.show{opacity:1;transform:none}.subtle{font-size:11px;color:#666;margin-top:15px;line-height:1.5}@media(max-width:800px){.plans{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}}@media(max-width:650px){.grid{grid-template-columns:1fr}.hero h1{font-size:34px}.container{width:92%;margin-top:28px}.card{padding:20px}}
</style>
</head>
<body>
<header class="nav"><div class="brand">SATYA</div><button class="logout" id="logoutBtn">LOGOUT</button></header>
<main class="container">
<section class="hero"><div><h1>My Account</h1><p>Your account, plan and billing.</p></div><span class="mode">RAZORPAY TEST MODE</span></section>
<section class="card" id="accountCard"><div class="message">Loading account...</div></section>
<section class="card">
<div class="plans-head"><div><h2 class="title" style="margin:0">Choose Your Plan</h2><p>Secure checkout powered by Razorpay.</p></div></div>
<div id="plans" class="plans"><div class="message" style="grid-column:1/-1">Loading plans...</div></div>
<p class="subtle">This is currently connected to Razorpay Test Mode, so no real money will be charged during testing.</p>
</section>
</main>
<div class="toast" id="toast"></div>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const U="https://sctyvhjmmtxjcpdecwfe.supabase.co",K="sb_publishable_qsyg3Kk-XeSl7TSXKSZchg_0GJuoksR",OWNER_UID="b1da36d1-80cd-4ed3-a763-4d98813de873";
const supabase=createClient(U,K),card=document.getElementById("accountCard"),plansEl=document.getElementById("plans"),toastEl=document.getElementById("toast");
let session=null,profile=null,plans=[];
function esc(v=""){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function toast(t){toastEl.textContent=t;toastEl.classList.add("show");setTimeout(()=>toastEl.classList.remove("show"),2800)}
function money(p){return new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:0}).format(Number(p||0)/100)}
function validCurrentPlan(){return profile?.plan_id&&profile.plan_id!=="free"&&profile.plan_expires_at&&new Date(profile.plan_expires_at)>new Date()}
function renderAccount(){const active=validCurrentPlan();const planName=plans.find(p=>p.id===profile.plan_id)?.name||(profile.plan_id||"Free");const expiry=profile.plan_expires_at?new Date(profile.plan_expires_at).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"}):"No expiry";card.innerHTML=`<h2 class="title">Account Overview</h2><div class="grid"><div class="item"><div class="label">Name</div><div class="value">${esc(profile.name||"Not set")}</div></div><div class="item"><div class="label">Email</div><div class="value">${esc(profile.email||session.user.email||"")}</div></div><div class="item"><div class="label">Account Status</div><span class="status">${esc(profile.status||"active")}</span></div><div class="item"><div class="label">Current Plan</div><div class="value">${esc(active?planName:"Free")}</div></div><div class="item"><div class="label">Plan Expiry</div><div class="value">${esc(active?expiry:"No active paid plan")}</div></div><div class="item"><div class="label">Joined</div><div class="value">${profile.created_at?new Date(profile.created_at).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"}):"Unknown"}</div></div></div>`}
function renderPlans(){const paid=plans.filter(p=>p.id!=="free"&&p.is_active);if(!paid.length){plansEl.innerHTML='<div class="message" style="grid-column:1/-1">No paid plans available.</div>';return}const active=validCurrentPlan();plansEl.innerHTML=paid.map(p=>{const current=active&&profile.plan_id===p.id;return `<article class="plan ${current?"current":""}"><div class="plan-name">${esc(p.name)}</div><div class="price">${money(p.amount_paise)}</div><div class="period">for ${Number(p.duration_days)||30} days</div><ul><li>Account access</li><li>Secure billing</li><li>${Number(p.duration_days)||30}-day plan period</li></ul><button class="buy" data-plan="${esc(p.id)}">${current?"Extend Plan":"Choose "+esc(p.name)}</button></article>`}).join("");document.querySelectorAll(".buy").forEach(b=>b.onclick=()=>startCheckout(b.dataset.plan,b))}
async function loadProfile(){const{data,error}=await supabase.from("user_profiles").select("name,email,status,created_at,plan_id,plan_expires_at").eq("id",session.user.id).maybeSingle();if(error||!data)throw new Error("Profile unavailable");if(data.status==="blocked"){await supabase.auth.signOut();location.replace("user-auth.html?blocked=1");return false}profile=data;return true}
async function loadPlans(){const{data,error}=await supabase.from("subscription_plans").select("id,name,amount_paise,currency,duration_days,is_active").eq("is_active",true).order("amount_paise");if(error)throw error;plans=data||[]}
async function startCheckout(planId,button){if(!window.Razorpay){toast("Razorpay checkout failed to load");return}const original=button.textContent;button.disabled=true;button.textContent="Preparing...";try{const{data,error}=await supabase.functions.invoke("create-razorpay-order",{body:{plan_id:planId}});if(error)throw error;if(!data?.ok)throw new Error(data?.error||"Order creation failed");const rz=new window.Razorpay({key:data.key_id,amount:data.amount,currency:data.currency,name:"SATYA",description:`${data.plan.name} — ${data.plan.duration_days} days`,order_id:data.order_id,prefill:{name:profile.name||"",email:profile.email||session.user.email||""},theme:{color:"#111111"},handler:async function(response){toast("Payment received. Verifying...");const{data:verified,error:verifyError}=await supabase.functions.invoke("verify-razorpay-payment",{body:{razorpay_order_id:response.razorpay_order_id,razorpay_payment_id:response.razorpay_payment_id,razorpay_signature:response.razorpay_signature}});if(verifyError||!verified?.ok){console.error(verifyError,verified);toast("Payment verification failed");return}await loadProfile();renderAccount();renderPlans();toast(`${data.plan.name} activated successfully`)},modal:{ondismiss:function(){toast("Payment cancelled")}}});rz.on("payment.failed",function(r){console.error(r.error);toast(r.error?.description||"Payment failed")});rz.open()}catch(e){console.error(e);toast(e?.message||"Unable to start payment")}finally{button.disabled=false;button.textContent=original}}
async function init(){const{data:{session:s}}=await supabase.auth.getSession();session=s;if(!session?.user){location.replace("user-auth.html");return}if(session.user.id===OWNER_UID){location.replace("owner-dashboard.html");return}try{await Promise.all([loadProfile(),loadPlans()]);renderAccount();renderPlans()}catch(e){console.error(e);card.innerHTML='<div class="message">Unable to load account.</div>';plansEl.innerHTML='<div class="message" style="grid-column:1/-1">Unable to load plans.</div>'}}
document.getElementById("logoutBtn").onclick=async()=>{await supabase.auth.signOut();location.replace("user-auth.html")};
init();
</script>
</body>
</html>
